name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: relay-linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: rust-ssh
            features: ""
          - os: macos-14
            name: connect-macos-aarch64
            target: aarch64-apple-darwin
            binary: rust-ssh-connect
            features: --features desktop
          - os: windows-latest
            name: agent-windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: rust-ssh.exe
            features: ""
          - os: windows-latest
            name: client-windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: rust-ssh-client.exe
            features: --features desktop
          - os: windows-latest
            name: connect-windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: rust-ssh-connect.exe
            features: --features desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}" ${{ matrix.features }} --bin "${{ matrix.binary }}"
      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/rust-ssh-${{ matrix.name }}${{ endsWith(matrix.binary, '.exe') && '.exe' || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-ssh-${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rust-ssh-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
