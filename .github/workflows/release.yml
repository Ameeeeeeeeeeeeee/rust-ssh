name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: server-linux-x86_64
            asset: rust-ssh-server-linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: rust-ssh-server
            extension: ""
            features: ""
          - os: macos-14
            name: connect-macos-aarch64
            asset: Rust-SSH-Connect-macos-aarch64
            target: aarch64-apple-darwin
            binary: rust-ssh-connect
            extension: ""
            features: --features desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}" ${{ matrix.features }} --bin "${{ matrix.binary }}"
      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}${{ matrix.extension }}" "dist/${{ matrix.asset }}${{ matrix.extension }}"
          if [[ "${{ matrix.name }}" == "server-linux-x86_64" ]]; then
            cp examples/rust-ssh-server.service dist/rust-ssh-server.service
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rust-ssh-${{ matrix.name }}
          path: dist/*

  windows-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client-windows-x86_64
            binary: rust-ssh-client
            wxs: rust-ssh-client.wxs
            output: Rust-SSH-Client-windows-x86_64.msi
          - name: connect-windows-x86_64
            binary: rust-ssh-connect
            wxs: rust-ssh-connect.wxs
            output: Rust-SSH-Connect-windows-x86_64.msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows GUI binary
        shell: pwsh
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --features desktop --bin "${{ matrix.binary }}" --bin rust-ssh-installer-helper
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP\wix" --version 5.0.2 wix
          & "$env:RUNNER_TEMP\wix\wix.exe" extension add WixToolset.UI.wixext/5.0.2
          & "$env:RUNNER_TEMP\wix\wix.exe" extension add WixToolset.Util.wixext/5.0.2
      - name: Build MSI
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $binaryPath = (Resolve-Path "target\x86_64-pc-windows-msvc\release\${{ matrix.binary }}.exe").Path
          $helperPath = (Resolve-Path "target\x86_64-pc-windows-msvc\release\rust-ssh-installer-helper.exe").Path
          $iconPath = (Resolve-Path "packaging\windows\rust-ssh.ico").Path
          New-Item -ItemType Directory -Force dist | Out-Null
          & "$env:RUNNER_TEMP\wix\wix.exe" build -arch x64 -culture zh-CN -culture en-US -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -d "ProductVersion=$version" -d "BinaryPath=$binaryPath" -d "InstallerHelperPath=$helperPath" -d "IconPath=$iconPath" "packaging\windows\${{ matrix.wxs }}" -out "dist\${{ matrix.output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-ssh-${{ matrix.name }}-msi
          path: dist/*.msi

  publish:
    needs: [build, windows-installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rust-ssh-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: dist/*
